version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: formcraft
      POSTGRES_USER: formcraft
      POSTGRES_PASSWORD: formcraft123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formcraft -d formcraft"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      FORMCRAFT_DATABASE_URL: postgresql://formcraft:formcraft123@db:5432/formcraft
      FORMCRAFT_JWT_SECRET: formcraft-plm-dev-secret-key-please-override-in-production-min-256-bits
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./formcraft-plm-frontend/formcraft-plm-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: on-failure

volumes:
  pgdata:
