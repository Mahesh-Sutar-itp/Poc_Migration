spring:
  application:
    name: formcraft-plm

  datasource:
    url: jdbc:postgresql://localhost:5432/formcraft
    username: formcraft
    password: formcraft123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

formcraft:
  jwt:
    secret: ${FORMCRAFT_JWT_SECRET:formcraft-plm-dev-secret-key-please-override-in-production-min-256-bits}
    expiration-ms: ${FORMCRAFT_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${FORMCRAFT_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    fr.formcraft: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
