spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  servlet:
    context-path: /api

formcraft:
  jwt:
    secret: test-jwt-secret-key-for-unit-and-integration-tests-only-min-256-bits
    expiration-ms: 3600000
