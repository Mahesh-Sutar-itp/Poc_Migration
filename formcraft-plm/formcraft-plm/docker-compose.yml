version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: formcraft-db
    environment:
      POSTGRES_DB: formcraft
      POSTGRES_USER: formcraft
      POSTGRES_PASSWORD: formcraft123
    ports:
      - "5432:5432"
    volumes:
      - formcraft_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formcraft -d formcraft"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - formcraft-network

  # ── FormCraft PLM Application ────────────────────────────────────────────
  formcraft-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formcraft-plm
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/formcraft
      SPRING_DATASOURCE_USERNAME: formcraft
      SPRING_DATASOURCE_PASSWORD: formcraft123
      FORMCRAFT_JWT_SECRET: formcraft-plm-docker-compose-secret-key-min-256-bits-change-me
      FORMCRAFT_JWT_EXPIRATION_MS: 86400000
      FORMCRAFT_CORS_ORIGINS: ${FORMCRAFT_CORS_ORIGINS:-http://localhost:3000}
      FORMCRAFT_CUSTOMIZATIONS_ROOT_PATH: /app/customs-src
    ports:
      - "8080:8080"
    # Activate client customizations by bind-mounting a folder of their built jars
    # over /app/customs (empty by default — see Dockerfile). Customizations live in
    # the separate Customs repository (sibling to Poc_Migration) and are built there
    # independently of this app; this never requires rebuilding the core image.
    volumes:
      - ${CUSTOMS_JARS_DIR:-../../../Customs/nordic-snacks/target}:/app/customs
      # Read-write mount of the whole Customs repo root so Gate 2's
      # UI-product-attributes-config/product-attributes.json files (one per
      # customization subfolder) can be read on startup and written back to
      # when a new attribute is defined via the API — see FORMCRAFT_CUSTOMIZATIONS_ROOT_PATH above.
      - ${CUSTOMS_ROOT_DIR:-../../../Customs}:/app/customs-src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - formcraft-network
    restart: on-failure

  formcraft-frontend:
    build:
      context: ../../formcraft-plm-frontend/formcraft-plm-frontend
      dockerfile: Dockerfile
    container_name: formcraft-plm-frontend
    ports:
      - "3000:80"
    depends_on:
      - formcraft-app
    networks:
      - formcraft-network
    restart: on-failure

volumes:
  formcraft_db_data:
    driver: local

networks:
  formcraft-network:
    driver: bridge
